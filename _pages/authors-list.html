---
title: "Authors"
layout: modern-default
permalink: "/authors-list.html"
---

<div class="container" style="max-width: 800px; padding-top: 2rem; padding-bottom: 4rem;">
    <h1 style="margin-bottom: 2rem;">Authors</h1>

    <div style="display: grid; gap: 1.5rem;">
        {% for author in site.authors %}
        <div style="border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; align-items: center; gap: 1.5rem;">
            <img alt="{{ author[1].name }}" src="{{ site.baseurl }}/{{ author[1].avatar }}" style="border-radius: 50%; width: 80px; height: 80px; object-fit: cover;">
            <div>
                <a href="{{ site.baseurl }}/author-{{ author[1].name | slugify }}" style="color: var(--text); text-decoration: none;">
                    <h3 style="margin-bottom: 0.25rem;">{{ author[1].name }}</h3>
                    <small style="color: var(--accent);">View Posts →</small>
                </a>
                <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.9rem;">{{ author[1].bio }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
