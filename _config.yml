# Site Settings
title: Sumit Srivastava
name: 'Sumit Srivastava'
description: 'Research • Engineering • Philosophy • Food'

# Google Analytics
google_analytics: G-XXXXXXXXXX # Replace with your Google Analytics tracking ID

# Visitor Counter with Country Tracking
# Supported services: 'flagcounter', 'clustrmaps', 'goatcounter', 'custom'
visitor_counter:
  enabled: true
  service: 'flagcounter'  # Options: 'flagcounter', 'clustrmaps', 'goatcounter', 'custom'
  
  # Flag Counter settings (https://flagcounter.com/)
  # To get your flagcounter_id:
  # 1. Visit https://flagcounter.com/
  # 2. Click "Get your Flag Counter"
  # 3. Customize appearance and copy the code
  # 4. Extract the ID from the URL (e.g., if URL contains 'count2/aBcD', use 'aBcD')
  flagcounter_id: 'aBcD'  # Replace with your actual Flag Counter ID
  columns: 3              # Number of columns to display flags
  maxflags: 12            # Maximum number of country flags to show
  label: 'Visitors'       # Label text to display
  background_color: 'FFFFFF'  # Background color in hex (without #)
  text_color: '000000'        # Text color in hex (without #)
  border_color: 'CCCCCC'      # Border color in hex (without #)
  
  # ClustrMaps settings (https://clustrmaps.com/) - Alternative option
  # clustrmaps_id: 'your-clustrmaps-id'
  
  # GoatCounter settings (https://goatcounter.com/) - Privacy-friendly alternative
  # goatcounter_id: 'your-site-name'
  
  # Custom HTML - For any other counter service
  # custom_html: '<your custom counter code here>'
baseurl: ""
url: "https://sumitsrv.github.io"
logo: 'assets/images/sumit-srivastava-profile.jpg'
favicon: 'assets/images/favicon.ico'
email: 'srv.sumit@gmail.com'
disqus: 'sumitsrv-github-io'

# Social Media Links
social:
  linkedin: https://www.linkedin.com/in/sumit-srv
  github: https://github.com/sumitsrv
  google_scholar: https://scholar.google.com/citations?user=cQhsN6IAAAAJ&hl=en
  instagram: https://www.instagram.com/srvsumit/
  twitter: https://x.com/SumSrvt

# Navigation
navigation:
  - title: About
    url: /about/
  - title: Research
    url: /research/
  - title: Engineering
    url: /engineering/
  - title: Blog
    url: /blog/
  - title: Contact
    url: /contact/

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
paginate: 6
paginate_path: /page:num/

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - .git/

# Performance Settings
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  ignore:
    envs: ["development"]
  blanklines: false
  profile: false

# SEO & Social Sharing
twitter:
  username: sumsrvt
  card: summary_large_image

# Plugins (GitHub Pages compatible)
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag

# Progressive Web App
pwa:
  enabled: true
  sw_filename: service-worker.js
  sw_src_filepath: service-worker.js
  dest_js_directory: assets/js
  precache_recent_posts_num: 5
  precache_glob_patterns:
    - "assets/css/*.css"
    - "assets/js/*.js"
  
authors:
    sumit:
      name:           Sumit
      site:           https://sumitsrv.github.io
      avatar:         assets/images/sumit-srivastava-profile.jpg
      bio:            "Hi, I am Sumit."
      email:  srv.sumit@gmail.com
      twitter:        https://twitter.com/sumsrvt
      social:
        name: Sumit Srivastava
        links:
          - https://www.linkedin.com/in/sumit-srv/
 
# Defaults
defaults:
  # all posts
  - scope:
      path: "_posts"
    values:
      layout: modern-post
      author: sumit
      avatar: /assets/images/sumit-srivastava-profile.jpg
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: modern-default
      
# Theme Settings
theme_skin: classic # classic, dark, modern
dark_mode_toggle: true
enable_search: true

# Content Settings
show_excerpts: true
reading_time: true
show_related_posts: true
show_post_categories: true
show_post_tags: true
enable_social_sharing: true


# Exclude metadata and development time dependencies (like Grunt plugins)
include:
  - "_pages"
  
exclude: 
  - README.markdown
  - package.json
  - grunt.js
  - Gruntfile.js
  - Gruntfile.coffee
  - node_modules
  - vendor/
  - Gemfile
  - Gemfile.lock
  - "**/*.erb"
  - "**/site_template/**"
